# 의존성과 GitHub Actions의 보안 업데이트를 자동으로 PR로 올림
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # 서로 버전을 맞춰야 하는 패키지는 한 PR로 묶어 올림 (따로 올리면 설치 단계에서 실패함)
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
